name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发的部署，跳过排队的运行
concurrency:
  group: 'pages'
  cancel-in-progress: true

# 统一 pnpm 供应链时间窗（含 `pnpm tauri build` 内部触发的 install）
env:
  npm_config_minimum_release_age: '0'

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm 版本由 package.json 的 packageManager 字段驱动；不要再写 version（否则 pnpm 报 Multiple versions）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        # pnpm 12 在部分环境默认启用 24h 供应链时间窗（ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION），
        # 与本机默认不一致；显式置 0 保证同一条 lockfile 两侧行为一致。
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Build landing & preview bundle
        run: pnpm exec vite build --config preview/vite.config.mts --base ./

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
