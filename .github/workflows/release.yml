name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (必须与 tauri.conf.json / package.json 版本一致，例如 v1.1.2)'
        required: true
        default: 'v1.1.2'

# 默认只读：只有 publish-release 需要 contents: write
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 发布前门禁：类型检查 + 单测 + Rust 测试（避免把红构建发出去）
  verify:
    name: Verify before release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 字段驱动；不要再写 version（否则 pnpm 报 Multiple versions）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        # pnpm 12 在部分环境默认启用 24h 供应链时间窗（ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION），
        # 与本机默认不一致；显式置 0 保证同一条 lockfile 两侧行为一致。
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Run verification suite
        run: ./scripts/verify.sh

      - name: Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin

    # 全量使用 GitHub 当前活跃的 macOS Apple Silicon (arm64) Runner 池，杜绝 macos-13 停服死锁
    runs-on: macos-latest

    env:
      # 有证书才签名/公证（fork 仓库或本地无 secret 时自动跳过）
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 字段驱动；不要再写 version（否则 pnpm 报 Multiple versions）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust with target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # 必须按 target 分 key：arm64 与 x86_64 的产物/依赖特性不同
          key: ${{ matrix.target }}

      - name: Install dependencies
        # pnpm 12 在部分环境默认启用 24h 供应链时间窗（ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION），
        # 与本机默认不一致；显式置 0 保证同一条 lockfile 两侧行为一致。
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/nervd-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/nervd-certificate.p12"
          security import "$RUNNER_TEMP/nervd-certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          IDENTITY="${APPLE_SIGNING_IDENTITY:-$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)"/\1/p' | head -n 1)}"
          if [ -z "$IDENTITY" ]; then
            echo "::error::证书已导入但未找到可用的 codesign 身份"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "已导入签名身份: $IDENTITY"

      - name: Skip code signing (no certificate configured)
        if: env.APPLE_CERTIFICATE == ''
        run: echo "::warning::APPLE_CERTIFICATE 未配置，跳过 macOS 签名与公证（本次产物未签名）"

      - name: Build Tauri DMG (${{ matrix.target }})
        # APPLE_SIGNING_IDENTITY 存在时，Tauri 会在打包前对 .app 完成 codesign
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Codesign, notarize and staple
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP_PATH=$(find "$BUNDLE/macos" -maxdepth 2 -name "*.app" 2>/dev/null | head -n 1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 ${{ matrix.target }} 的 .app 产物"
            exit 1
          fi
          # 显式签名（幂等）：确保 runtime 加固与时间戳齐全
          codesign --deep --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          DMG_PATH=$(find "$BUNDLE/dmg" -maxdepth 1 -name "*.dmg" 2>/dev/null | head -n 1 || true)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::未找到 ${{ matrix.target }} 的 DMG 产物"
            exit 1
          fi
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG_PATH"
            xcrun stapler validate "$DMG_PATH"
          else
            echo "::warning::APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 未配置，已签名但跳过公证"
          fi

      - name: Cleanup signing keychain
        if: always() && env.APPLE_KEYCHAIN_PATH != ''
        run: |
          security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/nervd-certificate.p12"

      - name: Package Release Assets
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          VERSION=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          TARGET_BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"

          calc_sha256() {
            local file="$1"
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$file" > "${file}.sha256"
            elif command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file" > "${file}.sha256"
            else
              node -e "const fs=require('fs'),crypto=require('crypto');const buf=fs.readFileSync(process.argv[1]);const hash=crypto.createHash('sha256').update(buf).digest('hex');process.stdout.write(hash + '  ' + process.argv[1] + '\n');" "$file" > "${file}.sha256"
            fi
          }

          # 只在当前 matrix.target 的产物目录里找，避免把另一架构的 DMG 混进来
          DMG_LIST=$(find "$TARGET_BUNDLE/dmg" -maxdepth 1 -name "*.dmg" 2>/dev/null | sort || true)
          if [ -z "$DMG_LIST" ]; then
            echo "::warning::未在 $TARGET_BUNDLE/dmg 找到 DMG，回退到 src-tauri/target 全局搜索"
            DMG_LIST=$(find src-tauri/target -name "*.dmg" -path "*/bundle/dmg/*" 2>/dev/null | sort || true)
          fi
          if [ -z "$DMG_LIST" ]; then
            echo "::error::DMG not found in $TARGET_BUNDLE or src-tauri/target" >&2
            exit 1
          fi
          DMG_COUNT=$(printf '%s\n' "$DMG_LIST" | grep -c . || true)
          if [ "$DMG_COUNT" -gt 1 ]; then
            echo "::warning::找到 $DMG_COUNT 个 DMG（${{ matrix.target }}），取第一个；请人工确认产物架构"
            printf '%s\n' "$DMG_LIST"
          fi
          # 优先选路径含当前 target 的产物，其次文件名含当前架构，降低回退搜索选错架构的概率
          DMG_FILE=$(printf '%s\n' "$DMG_LIST" | grep -F "${{ matrix.target }}" | head -n 1 || true)
          if [ -z "$DMG_FILE" ]; then
            DMG_FILE=$(printf '%s\n' "$DMG_LIST" | grep -i "${{ matrix.arch }}" | head -n 1 || true)
          fi
          if [ -z "$DMG_FILE" ]; then
            DMG_FILE=$(printf '%s\n' "$DMG_LIST" | head -n 1)
          fi
          if [ -f "$DMG_FILE" ]; then
            TARGET_NAME="nervd_${VERSION}_${{ matrix.arch }}.dmg"
            cp "$DMG_FILE" "dist-assets/${TARGET_NAME}"
            cd dist-assets
            calc_sha256 "${TARGET_NAME}"
            cd ..
            echo "Created DMG: ${TARGET_NAME} (from ${DMG_FILE})"
          else
            echo "Error: DMG not found in src-tauri/target" >&2
            exit 1
          fi
          ls -la dist-assets/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nervd-dmg-${{ matrix.arch }}
          path: dist-assets/*
          retention-days: 7

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc

    runs-on: windows-latest

    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 字段驱动；不要再写 version（否则 pnpm 报 Multiple versions）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust with target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install dependencies
        # pnpm 12 在部分环境默认启用 24h 供应链时间窗（ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION），
        # 与本机默认不一致；显式置 0 保证同一条 lockfile 两侧行为一致。
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Build Tauri Windows (${{ matrix.target }})
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Sign Windows installers (optional)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/nervd-sign.pfx"
          SIGNTOOL=$(command -v signtool.exe || true)
          if [ -z "$SIGNTOOL" ]; then
            SIGNTOOL=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -maxdepth 3 \
              -name signtool.exe -path "*x64*" 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$SIGNTOOL" ]; then
            echo "::error::未找到 signtool.exe"
            exit 1
          fi
          SIGNED=0
          while IFS= read -r -d '' file; do
            echo "Signing $file"
            "$SIGNTOOL" sign /f "$RUNNER_TEMP/nervd-sign.pfx" \
              /p "$WINDOWS_CERTIFICATE_PASSWORD" /fd SHA256 \
              /tr http://timestamp.digicert.com /td SHA256 "$file"
            SIGNED=$((SIGNED + 1))
          done < <(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.exe' -o -name '*.msi' \) -print0)
          rm -f "$RUNNER_TEMP/nervd-sign.pfx"
          if [ "$SIGNED" -eq 0 ]; then
            echo "::error::未找到可签名的 Windows 安装包"
            exit 1
          fi

      - name: Skip Windows signing (no certificate configured)
        if: env.WINDOWS_CERTIFICATE == ''
        shell: bash
        run: echo "::warning::WINDOWS_CERTIFICATE 未配置，跳过 Windows 安装包签名"

      - name: Package Release Assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          VERSION=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          TARGET_BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"

          calc_sha256() {
            local file="$1"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file" > "${file}.sha256"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$file" > "${file}.sha256"
            else
              node -e "const fs=require('fs'),crypto=require('crypto');const buf=fs.readFileSync(process.argv[1]);const hash=crypto.createHash('sha256').update(buf).digest('hex');process.stdout.write(hash + '  ' + process.argv[1] + '\n');" "$file" > "${file}.sha256"
            fi
          }

          # 只在当前 matrix.target 的产物目录里找安装包
          EXE_LIST=$(find "$TARGET_BUNDLE/nsis" -maxdepth 1 -name "*.exe" 2>/dev/null | sort || true)
          if [ -z "$EXE_LIST" ]; then
            echo "::warning::未在 $TARGET_BUNDLE/nsis 找到 .exe，回退到 src-tauri/target 全局搜索"
            EXE_LIST=$(find src-tauri/target -name "*.exe" -path "*/bundle/nsis/*" 2>/dev/null | sort || true)
          fi
          EXE_FILE=""
          if [ -n "$EXE_LIST" ]; then
            EXE_COUNT=$(printf '%s\n' "$EXE_LIST" | grep -c . || true)
            if [ "$EXE_COUNT" -gt 1 ]; then
              echo "::warning::找到 $EXE_COUNT 个 .exe（${{ matrix.target }}），取第一个；请人工确认架构"
              printf '%s\n' "$EXE_LIST"
            fi
            EXE_FILE=$(printf '%s\n' "$EXE_LIST" | grep -F "${{ matrix.target }}" | head -n 1 || true)
            if [ -z "$EXE_FILE" ]; then
              EXE_FILE=$(printf '%s\n' "$EXE_LIST" | head -n 1)
            fi
          fi
          if [ -f "$EXE_FILE" ]; then
            TARGET_EXE="nervd_${VERSION}_${{ matrix.arch }}-setup.exe"
            cp "$EXE_FILE" "dist-assets/${TARGET_EXE}"
            cd dist-assets
            calc_sha256 "${TARGET_EXE}"
            cd ..
            echo "Created Windows EXE: ${TARGET_EXE} (from ${EXE_FILE})"
          fi

          MSI_LIST=$(find "$TARGET_BUNDLE/msi" -maxdepth 1 -name "*.msi" 2>/dev/null | sort || true)
          if [ -z "$MSI_LIST" ]; then
            echo "::warning::未在 $TARGET_BUNDLE/msi 找到 .msi，回退到 src-tauri/target 全局搜索"
            MSI_LIST=$(find src-tauri/target -name "*.msi" -path "*/bundle/msi/*" 2>/dev/null | sort || true)
          fi
          MSI_FILE=""
          if [ -n "$MSI_LIST" ]; then
            MSI_COUNT=$(printf '%s\n' "$MSI_LIST" | grep -c . || true)
            if [ "$MSI_COUNT" -gt 1 ]; then
              echo "::warning::找到 $MSI_COUNT 个 .msi（${{ matrix.target }}），取第一个；请人工确认架构"
              printf '%s\n' "$MSI_LIST"
            fi
            MSI_FILE=$(printf '%s\n' "$MSI_LIST" | grep -F "${{ matrix.target }}" | head -n 1 || true)
            if [ -z "$MSI_FILE" ]; then
              MSI_FILE=$(printf '%s\n' "$MSI_LIST" | head -n 1)
            fi
          fi
          if [ -f "$MSI_FILE" ]; then
            TARGET_MSI="nervd_${VERSION}_${{ matrix.arch }}.msi"
            cp "$MSI_FILE" "dist-assets/${TARGET_MSI}"
            cd dist-assets
            calc_sha256 "${TARGET_MSI}"
            cd ..
            echo "Created Windows MSI: ${TARGET_MSI} (from ${MSI_FILE})"
          fi

          if [ ! -f "dist-assets/nervd_${VERSION}_${{ matrix.arch }}-setup.exe" ] && [ ! -f "dist-assets/nervd_${VERSION}_${{ matrix.arch }}.msi" ]; then
            echo "Error: No Windows installer (.exe or .msi) found" >&2
            exit 1
          fi

          ls -la dist-assets/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nervd-windows-${{ matrix.arch }}
          path: dist-assets/*
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-macos, build-windows]
    runs-on: ubuntu-latest
    # 唯一需要写权限的 job（create/update release）
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: List Artifacts
        run: |
          ls -lh release-binaries/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          else
            RELEASE_TAG="${{ github.ref_name }}"
          fi
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Target Release Tag: ${RELEASE_TAG}"

      - name: Verify version consistency
        run: |
          set -euo pipefail
          TAG="${{ steps.tag_info.outputs.release_tag }}"
          VERSION="${TAG#v}"
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=${TAG} version=${VERSION} tauri.conf=${TAURI_VERSION} package.json=${PACKAGE_VERSION} Cargo.toml=${CARGO_VERSION}"
          FAILED=0
          if [ "$VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::tag ${TAG} 与 src-tauri/tauri.conf.json version ${TAURI_VERSION} 不一致（会导致更新器 404）"
            FAILED=1
          fi
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::tag ${TAG} 与 package.json version ${PACKAGE_VERSION} 不一致"
            FAILED=1
          fi
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::warning::tag ${TAG} 与 src-tauri/Cargo.toml version ${CARGO_VERSION} 不一致（更新器以 tauri.conf.json 为准，建议同步）"
          fi
          exit "$FAILED"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.release_tag }}
          name: "nervd ${{ steps.tag_info.outputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
