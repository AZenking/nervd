name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dmg:
    name: Build macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin

    # 全量使用 GitHub 当前活跃的 macOS Apple Silicon (arm64) Runner 池，杜绝 macos-13 停服死锁
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri DMG (${{ matrix.target }})
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Package Release Assets
        id: package
        run: |
          mkdir -p dist-assets
          VERSION=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          # 提取当前 target 对应的 dmg 产物
          DMG_FILE=$(find src-tauri/target -name "*.dmg" -path "*/bundle/dmg/*" | head -n 1)
          if [ -f "$DMG_FILE" ]; then
            TARGET_NAME="nervd_${VERSION}_${{ matrix.arch }}.dmg"
            cp "$DMG_FILE" "dist-assets/${TARGET_NAME}"
            cd dist-assets
            shasum -a 256 "${TARGET_NAME}" > "${TARGET_NAME}.sha256"
            cd ..
            echo "Created DMG: ${TARGET_NAME}"
          else
            echo "Error: DMG not found in src-tauri/target" >&2
            exit 1
          fi
          ls -la dist-assets/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nervd-dmg-${{ matrix.arch }}
          path: dist-assets/*
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-dmg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: List Artifacts
        run: |
          ls -lh release-binaries/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          else
            RELEASE_TAG="${{ github.ref_name }}"
          fi
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Target Release Tag: ${RELEASE_TAG}"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.release_tag }}
          name: "nervd ${{ steps.tag_info.outputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
