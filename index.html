<!doctype html>
<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/nervd-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nervd</title>
    <script>
      window.__NERVD_START_TIME__ = Date.now();
      try {
        var theme = localStorage.getItem('nervd-theme') || 'system';
        var prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var prefersLight = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        // DESIGN §2.4：默认跟随系统；系统未声明偏好（深浅皆否）时回退深色（客户端基准视觉）。
        var isDark = theme === 'dark' || (theme !== 'light' && (prefersDark || !prefersLight));
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    </script>
    <style>
      /* 首帧启动遮罩：优先消费语义 token，theme.css 未加载时回退到等值字面量，
         避免闪白 / 闪黑；禁止在这里另立一套品牌色。 */
      :root {
        --splash-bg: var(--background, #ffffff);
        --splash-card-bg: var(--surface, #ffffff);
        --splash-border: var(--hairline, rgba(0, 0, 0, 0.08));
        --splash-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.12), 0 0 32px -4px rgba(94, 106, 210, 0.18);
        --splash-primary: var(--primary, #5e6ad2);
      }

      /* 明暗双通道：`.dark` 类与 `data-theme="dark"` 任一命中都切换遮罩（DESIGN §2.4） */
      html.dark,
      html[data-theme="dark"] {
        --splash-bg: var(--background, #121215);
        --splash-card-bg: var(--surface, #18181c);
        --splash-border: var(--hairline, rgba(255, 255, 255, 0.08));
        --splash-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.5), 0 0 32px -4px rgba(94, 106, 210, 0.25);
        --splash-primary: var(--primary, #5e6ad2);
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--splash-bg);
        overflow: hidden;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--splash-bg);
        opacity: 1;
        transform: scale(1);
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                    visibility 0.45s;
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }

      #app-splash.fade-out {
        opacity: 0;
        transform: scale(0.96);
        pointer-events: none;
        visibility: hidden;
      }

      .splash-card {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 76px;
        height: 76px;
        border-radius: 16px;
        background-color: var(--splash-card-bg);
        box-shadow: var(--splash-shadow);
        border: 1px solid var(--splash-border);
        overflow: hidden;
        animation: splash-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        -webkit-app-region: no-drag;
      }

      .splash-logo {
        width: 100%;
        height: 100%;
        border-radius: 16px;
        object-fit: cover;
        display: block;
      }

      .splash-loader-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, var(--splash-primary) 50%, transparent 100%);
        background-size: 200% 100%;
        animation: splash-shimmer 1.5s ease-in-out infinite;
      }

      @keyframes splash-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.985);
          opacity: 0.94;
        }
      }

      @keyframes splash-shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>

  <body class="bg-background text-foreground">
    <div id="root"></div>
    <div id="app-splash" role="status" aria-label="正在加载 nervd...">
      <div class="splash-card">
        <img
          src="/nervd-logo.png"
          alt="nervd logo"
          class="splash-logo"
          fetchpriority="high"
          loading="eager"
        />
        <div class="splash-loader-bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
