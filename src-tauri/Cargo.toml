[package]
name = "nervd"
version = "1.1.2"
description = "以云效需求为维度的 CI/CD 桌面工作台"
authors = ["charles"]
edition = "2021"

[lib]
name = "nervd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地时区换算（Local）需要 clock 特性；关闭默认特性以收敛体积（不需要 wasmbind / oldtime）
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", features = ["json", "query"] }
thiserror = "2"
keyring = "4"
tokio = { version = "1", features = ["time", "macros"] }
httpdate = "1.0.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 使用 unwind 而非 abort：单条 IPC 命令 panic 会被隔离在对应任务内，进程不会
# 立即 abort（前端能观察到该命令失败）；代价是 release 体积略增（约 1~3%）。
panic = "unwind"
strip = true
