[package]
name = "nervd"
version = "0.2.6"
description = "以云效需求为维度的 CI/CD 桌面工作台"
authors = ["charles"]
edition = "2021"

[lib]
name = "nervd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
thiserror = "2"
keyring = "4"
tokio = { version = "1", features = ["time", "macros"] }
httpdate = "1.0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
