id: shadcn-tailwind-migration
goal: 将 nervd 前端 UI 从手写 theme.css 迁移到 shadcn/ui（Base UI 底层）+ Tailwind CSS v4，保留 Hangar Control 工业暗色主题的全部设计 token，pnpm build 零错误
planningMode: execution
maxReviewLoops: 3
plan:
  summary: 五步执行：Tailwind v4 接入 → shadcn init（base 底层）+ 组件添加 → 工业 token 映射 → 全部组件迁移 → 构建验证与合规修复；每步以 diff/build 可客观判定的标准收口
  rationale: docs/ui-selection.md 调研结论的方案 B，用户 2026-09-28 确认直接执行
requirements:
  - id: req-tw4
    text: Tailwind CSS v4 + @tailwindcss/vite 插件接入 Vite 8（CSS-first 配置，不产生 tailwind.config.js），vite build 通过
  - id: req-shadcn-init
    text: shadcn/ui 以 Base UI 为底层完成 init（components.json 落地，别名 @/*），常用组件源码入库 src/components/ui/
  - id: req-theme
    text: theme.css 的 Hangar Control token 全量映射到 shadcn 语义 CSS 变量（@theme inline），IBM Plex 字体、13px 密排、直角（radius 0）、body 网格纹理、--sig-* 信号色全部保留
  - id: req-migrate
    text: App.tsx 与 10 个组件迁移到 shadcn 组件 + Tailwind 工具类；zustand store、src/lib、IPC 调用与类型契约零改动
  - id: req-ux-upgrade
    text: Toast 改为可堆叠队列实现；WriteOpButton 加 Tooltip，触发类写操作经 AlertDialog 二次确认；allowWriteOps=false 时写按钮置灰与 IPC 双重门控保持
  - id: req-build
    text: pnpm build（tsc && vite build）零错误
constraints:
  - kind: maxDurationMs
    value: 1200000
tasks:
  - id: tw-setup
    agentRole: reflex
    goal: |
      在本仓（Tauri2+React19+Vite8，包管理器 pnpm）接入 Tailwind CSS v4。逐步执行：
      1) pnpm add tailwindcss @tailwindcss/vite；
      2) vite.config.ts 注册 tailwindcss() 插件；
      3) src/styles/theme.css 顶部（@fontsource import 之前）追加 `@import "tailwindcss";`，其余内容不动；
      4) pnpm build 通过后 git commit（必须 commit，信息用 conventional 风格）。
      禁止创建 tailwind.config.js（v4 为 CSS-first）。
      完成判据（审阅按此核对 diff，勿额外加码）：package.json dependencies 含 tailwindcss 与 @tailwindcss/vite；vite.config.ts 有 tailwindcss() 插件注册；theme.css 首部有该 import；pnpm build 退出码 0；有 git commit。
  - id: shadcn-init
    agentRole: reflex
    dependsOn: [tw-setup]
    goal: |
      shadcn/ui 初始化并添加组件（全部用 pnpm dlx shadcn@latest ...）：
      1) tsconfig.json 与 tsconfig.node.json 的 compilerOptions 增加 baseUrl "." 与 paths {"@/*":["./src/*"]}；vite.config.ts 增加 resolve.alias 将 '@' 指向 src（用 path.resolve）；
      2) 非交互完成 init：底层选 base（Base UI），Vite 项目、RSC=false、tsx；样式任选（后续任务覆盖 token）；
      3) 依次 add：button input label textarea select checkbox switch dialog alert-dialog tooltip toast badge tabs separator scroll-area skeleton field card；
      4) pnpm build 通过后 git commit。
      完成判据（审阅按此核对，勿额外加码）：components.json 存在且 base 指向 Base UI 系；src/components/ui/ 下存在上列组件文件且可被 import；src/lib/utils.ts（或等价位置）有 cn()；tsconfig paths 生效；pnpm build 退出码 0；有 git commit。
  - id: theme-map
    agentRole: reflex
    dependsOn: [shadcn-init]
    goal: |
      把 theme.css 的 Hangar Control 工业主题映射到 shadcn 语义 token。原值：bg-0 #0b0e13 / bg-1 #11151d / bg-2 #181d28 / bg-3 #202634 / line #262d3d / line-strong #333c50 / ink-0 #e8ecf4 / ink-1 #9aa4b8 / ink-2 #5c6678 / accent #ff8a3d / sig-run #ffb454 / sig-ok #4ade80 / sig-fail #f87171 / sig-idle #6b7280。
      要求：
      - 语义变量按值落位：--background:#0b0e13；--card:#11151d；--popover:#181d28；--muted:#181d28、--muted-foreground:#9aa4b8；--foreground:#e8ecf4；--secondary:#202634、--secondary-foreground:#9aa4b8；--border:#262d3d、--input:#262d3d、--ring:#ff8a3d；--primary:#ff8a3d、--primary-foreground:#0b0e13；--destructive:#f87171；--radius:0px；
      - 保留自定义 --sig-run/--sig-ok/--sig-fail/--sig-idle 与 --rail-w:208px；
      - 保留 @fontsource IBM Plex Sans/Mono import；--font-sans/--font-mono 指向 IBM Plex；body 字号 13px、repeating-linear-gradient 双向 24px 网格背景、方形滚动条样式保留在全局 CSS；
      - 用 `@theme inline` 将语义变量暴露为工具类；
      - 本任务不删除 .btn/.input/.select 等旧原子样式（下一任务替换完再删）；
      4) pnpm build 通过后 git commit。
      完成判据（审阅按此核对，勿额外加码）：全局 CSS 中上列语义变量与值逐项存在；@theme inline 块存在；@fontsource import 与网格纹理保留；pnpm build 退出码 0；有 git commit。
  - id: comp-migrate
    agentRole: reason
    dependsOn: [theme-map]
    goal: |
      迁移 App.tsx 与 src/components/ 全部组件到 shadcn 组件 + Tailwind 工具类。先读 /Users/charles/.agents/skills/shadcn/rules/ 下 styling.md/forms.md/composition.md/icons.md/base-vs-radix.md 并遵循（要点：gap-* 禁 space-y-*；等宽高用 size-*；表单用 FieldGroup/Field；Dialog/AlertDialog 必须含 Title；按钮内图标用 data-icon 不加尺寸类；语义 token 禁裸色值；Base UI 用 render 替代 asChild；浮层组件不手写 z-index）。
      分组件迁移：
      - SettingsView：FieldGroup/Field + Input/Select/Checkbox/Switch + Button（保存/测试连接/重新拉取项目）；
      - WriteOpButton：Button + Tooltip；触发流水线等写操作经 AlertDialog 二次确认；allowWriteOps=false 置灰与双重门控保持；
      - Shell：ToastHost 改为可堆叠 toast 队列（Base UI toast）；顶栏与三栏布局 Tailwind 重排，侧栏宽 208px；
      - WorkitemDetail/TracePane/PipelineCard：Card/Badge/Tabs/Separator 组合，状态色用 --sig-* token；
      - LogViewer：ScrollArea + font-mono；
      - Sidebar：列表语义与选中态保持；
      - StatusDot：基于 --sig-* token 的圆点/Badge；
      - App.tsx：booting 态用 Skeleton/Spinner；
      - 迁移完成后删除 theme.css 中被替代的旧原子样式（.btn/.input/.select/.toast 等）并确认全仓无引用残留；
      - zustand store（src/store/）、src/lib/、src/types/ 零改动；所有 invoke IPC 调用保持原语义。
      完成判据（审阅按此核对，勿额外加码）：组件 import 自 @/components/ui/*；旧原子类在 CSS 与 TSX 中均无残留引用；git diff 显示 src/store、src/lib、src/types 无改动；pnpm build 退出码 0；有 git commit。
  - id: verify-fix
    agentRole: reason
    dependsOn: [comp-migrate]
    goal: |
      验证并修复：
      1) pnpm build 零错误，有错修复后复跑直到退出码 0；
      2) grep 全仓合规：无 space-y-*；TSX 无裸色值类（bg-[#...]/text-[#...] 例外需在总结说明）；Dialog/AlertDialog 均有 Title；组件内图标无尺寸类；无 asChild 残留（base 底层用 render）；
      3) 核对：ToastHost 为队列实现；写操作有 AlertDialog 确认与置灰门控；Tooltip 就位；
      4) theme.css 无死代码；
      5) 修复项 git commit。
      完成判据：上列 grep 与 build 全绿；输出总结（变更文件清单、token 映射表、遗留事项）。
acceptance:
  - given: Tailwind v4 已接入
    when: pnpm build
    then: tsc 与 vite build 零错误，dist 产物生成
  - given: shadcn init 完成
    when: 检查 components.json 与 src/components/ui/
    then: base 为 Base UI 系且 button/input/select/dialog/alert-dialog/tooltip/toast/checkbox/switch/field 等组件源码在库
  - given: 主题映射完成
    when: 检查全局 CSS 变量
    then: 语义变量值与原 Hangar Control token 一一对应（background #0b0e13、primary #ff8a3d、radius 0px 等），IBM Plex/网格纹理/--sig-* 保留
  - given: 组件迁移完成
    when: 审查 git diff
    then: 全部组件使用 shadcn + Tailwind，src/store、src/lib、src/types 无改动
  - given: ToastHost 迁移完成
    when: 审查其实现
    then: 为可堆叠队列实现（非单条覆盖），Base UI toast
  - given: allowWriteOps=false
    when: 审查 WriteOpButton
    then: 置灰逻辑保持，且触发类写操作有 AlertDialog 二次确认
